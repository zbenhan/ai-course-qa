services:
  qa:
    build: .
    container_name: ai-course-qa
    restart: unless-stopped
    environment:
      PORT: "8787"
      DATA_DIR: /data
      MAX_VOTES_PER_DEVICE: "3"
      # 允许访问接口的网页来源，多个用逗号分隔；* 表示不限制
      ALLOWED_ORIGINS: "${ALLOWED_ORIGINS:-*}"
      # 管理员令牌：用于删除问题，请务必改成一串随机字符
      ADMIN_TOKEN: "${ADMIN_TOKEN:-change-me-please}"
    volumes:
      - ./data:/data
    ports:
      # 只监听本地回环，由 Caddy / Nginx 负责对外加密访问
      - "127.0.0.1:8787:8787"
